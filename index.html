<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#14120e">
<title>HQ</title>
<style>
:root{--bg:#f4f2ec;--card:#fff;--ink:#1b1915;--mute:#6d675b;--line:#e6e1d5;--soft:#f3efe6;--amber:#f59e0b;--amber-ink:#8a5200;--red:#c0392b;--green:#2f8f5b;--bar:#14120e;--e:#f59e0b}
@media(prefers-color-scheme:dark){:root{--bg:#11100d;--card:#1b1915;--ink:#f1eee6;--mute:#a59e8e;--line:#2d2a23;--soft:#24211b;--amber-ink:#f7b955;--red:#e5604f;--green:#58b884;--bar:#0a0908}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px;width:100%}
textarea{min-height:110px;resize:vertical}
/* sign-in */
#lock{max-width:340px;margin:16vh auto 0;padding:0 16px;display:grid;gap:14px;text-align:center}
.logo{display:inline-block;font:800 1.05rem ui-monospace,Consolas,monospace;background:var(--amber);color:#1c1300;border-radius:7px;padding:3px 9px;letter-spacing:.06em}
#lock .logo{font-size:2rem;padding:6px 16px;justify-self:center}
.go{background:var(--amber);border:0;color:#1c1300;font-weight:700;border-radius:12px;padding:13px;width:100%;min-height:46px}
.keep{font-size:.85rem;color:var(--mute);display:flex;gap:8px;justify-content:center;align-items:center}.keep input{width:auto}
.err{color:var(--red);font-size:.9rem;min-height:1.2em;margin:0}
/* frame */
header.top{position:sticky;top:0;z-index:5;background:var(--bar);color:#f4f2ec}
.bar{max-width:1080px;margin:0 auto;padding:10px 16px 8px;display:flex;align-items:center;gap:10px}
.bar strong{font:700 .78rem ui-monospace,Consolas,monospace;letter-spacing:.16em;color:#cfc8b8}
.bar small{margin-left:auto;color:#a59e8e;font-size:.76rem;text-align:right}
.bar small.stale{color:#f7b955}
nav{max-width:1080px;margin:0 auto;display:flex;padding:0 8px}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px 9px;min-height:44px;white-space:nowrap;display:flex;gap:7px;align-items:center}
#prim button{color:#bdb6a6;font-weight:600}
#prim button[aria-current=page]{color:#fff;border-color:var(--c,var(--amber))}
#sub{overflow-x:auto;scrollbar-width:none;background:var(--card);border-bottom:1px solid var(--line);max-width:none}
#sub::-webkit-scrollbar{display:none}
#sub>div{max-width:1080px;margin:0 auto;display:flex;padding:0 8px;width:100%}
#sub button{color:var(--mute);font-size:.92rem;padding:9px 12px 8px}
#sub button[aria-current=page]{color:var(--ink);font-weight:700;border-color:var(--e)}
.n{font:700 .68rem ui-monospace,Consolas,monospace;border-radius:999px;padding:1px 7px;background:var(--amber);color:#1c1300}
.n.red{background:var(--red);color:#fff}
main{max-width:1080px;margin:0 auto;padding:18px 16px 110px;display:grid;gap:14px}
.hero h1{margin:0;font-size:1.7rem;letter-spacing:-.01em}
.hero p{margin:4px 0 0;color:var(--mute)}
.ehead{border-left:5px solid var(--e);padding-left:12px}
.ehead h1{margin:0;font-size:1.4rem}.ehead p{margin:2px 0 0;color:var(--mute);font-size:.86rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:2px}
.tile b{font:800 1.8rem/1.1 ui-monospace,Consolas,monospace}
.tile span{font:700 .68rem ui-monospace,Consolas,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.tile.red b{color:var(--red)}.tile.amber b{color:var(--amber-ink)}.tile.zero b{color:var(--mute);opacity:.55}
.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px 6px;min-width:0}
.sec h3{margin:0 0 4px;font:700 .72rem ui-monospace,Consolas,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);display:flex;gap:8px;align-items:center}
.sec h3 b{background:var(--soft);color:var(--ink);border-radius:999px;padding:1px 8px}
.sec.hot{border-color:var(--red)}.sec.hot h3{color:var(--red)}
.sec.quiet{padding:10px 14px;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;background:none;border-style:dashed}
.sec.quiet h3{margin:0;flex:none}.sec.quiet p{margin:0;flex:1 1 240px}.sec.quiet .acts{padding:0}.sec.quiet .act{margin:0}
.note,.empty{color:var(--mute);font-size:.86rem;margin:0 0 6px}
ul{list-style:none;margin:0;padding:0}
.row{border-top:1px solid var(--line)}.row:first-child{border-top:0}
.rh{display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;padding:10px 0;text-align:left;min-height:44px}
div.rh{cursor:default}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:#cdc7b9}
.now>.rh .dot{background:var(--red)}.soon>.rh .dot{background:var(--amber)}.ok>.rh .dot{background:var(--green)}
.tag{font:700 .62rem ui-monospace,Consolas,monospace;letter-spacing:.04em;border-radius:5px;padding:2px 6px;background:var(--mute);color:#fff;flex:none}
.tt{flex:1;min-width:0;overflow-wrap:anywhere}
.mm{color:var(--mute);font-size:.8rem;flex:none;max-width:46%;text-align:right}
.now>.rh .mm{color:var(--red);font-weight:600}
.chev{flex:none;color:var(--mute);font-size:1.1rem;transition:transform .15s}
.open>.rh .chev{transform:rotate(90deg)}
.rb{padding:0 0 12px 18px;display:grid;gap:8px;color:var(--mute);font-size:.88rem;overflow-wrap:anywhere}
.rb .txt{white-space:pre-wrap}
.rb .who{font:700 .7rem ui-monospace,Consolas,monospace;letter-spacing:.06em;text-transform:uppercase}
.rb ul{border-left:2px solid var(--line);padding-left:10px;color:var(--ink)}
.acts{display:flex;flex-wrap:wrap;gap:8px;padding:2px 0 6px}
.more,.act{background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:8px 12px;min-height:40px;font-size:.84rem;font-weight:600;color:var(--ink)}
.more{margin:6px 0 8px}
.act.go2{background:var(--amber);border-color:var(--amber);color:#1c1300}
.act.ghost{background:none;border-style:dashed;color:var(--mute)}
.act:disabled{opacity:.55;cursor:default}
.recs{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:10px;padding:4px 0 8px}
.rec{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:6px;align-content:start;background:var(--bg)}
.rec b{font-size:.95rem}.rec p{margin:0;color:var(--mute);font-size:.86rem}
.rec .to{font:700 .7rem ui-monospace,Consolas,monospace;letter-spacing:.04em;color:var(--amber-ink)}
.rec .pri{font:700 .66rem ui-monospace,Consolas,monospace;border-radius:999px;padding:2px 8px;background:var(--soft);color:var(--mute);justify-self:start}
.rec .pri.hot{background:var(--amber);color:#1c1300}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--e);border-radius:14px;padding:12px 14px;text-align:left;display:grid;gap:4px;min-height:44px}
.card b{font-size:1rem}.card small{color:var(--mute);font-size:.8rem}
.card .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{font:700 .68rem ui-monospace,Consolas,monospace;border-radius:999px;padding:2px 8px;background:var(--soft);color:var(--mute)}
.chip.red{background:var(--red);color:#fff}.chip.amber{background:var(--amber);color:#1c1300}
.area{border-top-width:1px;border-left:4px solid var(--line)}
.area.red{border-left-color:var(--red)}.area.amber{border-left-color:var(--amber)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:2px 18px;padding-bottom:8px}
.kv div{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding:8px 0;font-size:.88rem}
.kv span{color:var(--mute)}.kv b{font-weight:600;text-align:right}
h2.lab{margin:8px 0 -4px;font:700 .72rem ui-monospace,Consolas,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
footer{display:grid;gap:8px;justify-items:start;margin-top:6px}
#toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:var(--bar);color:#fff;border:1px solid #3a362d;border-radius:10px;padding:10px 14px;font-size:.88rem;max-width:min(92vw,460px);z-index:20}
#fab{position:fixed;right:18px;bottom:22px;z-index:7;background:var(--amber);color:#1c1300;border:0;border-radius:999px;padding:13px 20px;font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.35);min-height:48px}
#shade{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:15;display:grid;align-items:end;justify-items:center}
#sheet{background:var(--bg);border-radius:18px 18px 0 0;border:1px solid var(--line);width:min(100%,560px);max-height:92vh;overflow:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom));display:grid;gap:10px}
#sheet h2{margin:0;font-size:1.1rem}#sheet .ctx{color:var(--mute);font-size:.86rem;margin:0}
#sheet label{font:700 .68rem ui-monospace,Consolas,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);display:grid;gap:4px}
.seg{display:flex;gap:6px}.seg button{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 6px;min-height:44px;font-weight:600}
.seg button[aria-pressed=true]{background:var(--amber);border-color:var(--amber);color:#1c1300}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(min-width:641px){#shade{align-items:center}#sheet{border-radius:18px}}
@media(max-width:640px){
 #prim{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bar);padding:0 2px env(safe-area-inset-bottom);border-top:1px solid #2d2a23}
 #prim button{flex:1;justify-content:center;border-bottom:0;border-top:3px solid transparent;padding:10px 0;font-size:.74rem;flex-direction:column;gap:2px;min-height:54px}
 main{padding-bottom:150px}.hero h1{font-size:1.4rem}.mm{max-width:38%}
 #fab{bottom:calc(70px + env(safe-area-inset-bottom))}
}
</style>
</head>
<body>
<section id="lock" hidden>
 <span class="logo">HQ</span>
 <form id="form"><input id="pass" type="password" autocomplete="current-password" placeholder="Passphrase" aria-label="Passphrase" required>
 <p><button class="go" type="submit">Open HQ</button></p>
 <label class="keep"><input id="keep" type="checkbox"> Stay signed in on this device</label></form>
 <p class="err" id="err" role="alert"></p>
 <p class="note">Encrypted before it leaves the office PC. Opened here, on your device.</p>
</section>
<div id="app" hidden>
 <header class="top">
  <div class="bar"><span class="logo">HQ</span><strong>HEAD OFFICE</strong><small id="made"></small></div>
  <nav id="prim" aria-label="Entities"></nav>
  <nav id="sub" aria-label="Sections" hidden><div></div></nav>
 </header>
 <main id="view"></main>
 <button id="fab" type="button">Direct Head Office</button>
</div>
<div id="shade" hidden><form id="sheet" role="dialog" aria-modal="true"></form></div>
<div id="toast" role="status" hidden></div>
<script src="hq.js?v=8"></script>
</body>
</html>
